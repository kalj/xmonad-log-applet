name: Install packages with apt
description: >
  Install Ubuntu packages, keeping the downloaded packages in the Actions
  cache between runs, and retrying apt when a download stalls or crawls.

inputs:
  packages:
    description: Packages to install, separated by spaces
    required: false
    default: ''
  build-dep:
    description: Source directory whose Build-Depends to install as well
    required: false
    default: ''
  cache-name:
    description: Name of this job's package cache
    required: true

runs:
  using: composite
  steps:
    - name: Restore downloaded packages
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/apt-archives
        # The newest cache of this job; the key ends in a hash of its files
        key: apt-${{ runner.os }}-${{ inputs.cache-name }}-
        restore-keys: apt-${{ runner.os }}-${{ inputs.cache-name }}-

    - name: Install packages
      id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        BUILD_DEP: ${{ inputs.build-dep }}
        ARCHIVES: ${{ runner.temp }}/apt-archives
        CACHE_NAME: ${{ inputs.cache-name }}
      run: ${{ github.action_path }}/install.sh

    - name: Save downloaded packages
      # Also after a failure, so a re-run can carry on; but only when there
      # are packages and they changed, as a cache can't be overwritten
      if: >-
        always() &&
        steps.install.outputs.count != '0' &&
        steps.install.outputs.key != steps.restore.outputs.cache-matched-key
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.install.outputs.key }}
