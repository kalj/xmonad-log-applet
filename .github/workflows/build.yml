name: Build

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  applet:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Fail a job whose package downloads hang, instead of leaving the PR
    # pending for GitHub's default of six hours. The slowest normal run so
    # far took about 10 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MATE applet
            panel: mate
            panel-dev: libmate-panel-applet-dev
          - name: Xfce plugin
            panel: xfce4
            panel-dev: libxfce4panel-2.0-dev
          - name: GNOME panel module
            panel: gnome
            panel-dev: libgnome-panel-dev
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # For MATE, the Build-Depends in debian/control minus the packaging
        # tools; the other panels use their own development package
        run: |
          # Give up on a stalled download after 20 seconds without data and
          # retry it, instead of hanging until the job times out
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config \
            libglib2.0-dev libxcb1-dev libxcb-ewmh-dev \
            ${{ matrix.panel-dev }}

      - name: Configure
        # Fail on new warnings. GTK deprecation warnings are left out: the
        # applet still uses GTK 2 era APIs, and MATE's applet menu needs
        # GtkActionGroup.
        run: ./autogen.sh --with-panel=${{ matrix.panel }} CFLAGS="-O2 -Wall -Werror -Wno-deprecated-declarations"

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make check VERBOSE=1

      - name: Install
        # Into a staging directory, to check what gets installed where
        run: |
          make install DESTDIR="$RUNNER_TEMP/root"
          find "$RUNNER_TEMP/root" -type f | sort

  debian-package:
    name: Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # The packaging tools, then the Build-Depends from debian/control
        run: |
          # Give up on a stalled download after 20 seconds without data and
          # retry it, instead of hanging until the job times out
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev debhelper
          sudo apt-get build-dep -y ./

      - name: Build package
        # Also runs the unit tests (dh_auto_test runs make check)
        run: dpkg-buildpackage -us -uc -b

      - name: Collect package
        # dpkg-buildpackage writes to the parent directory
        run: mkdir debs && mv ../*.deb debs/

      - uses: actions/upload-artifact@v4
        with:
          name: xmonad-log-applet-deb
          path: debs/*.deb

  xmonad-config:
    name: Sample xmonad.hs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install GHC and the Haskell libraries
        run: |
          # Give up on a stalled download after 20 seconds without data and
          # retry it, instead of hanging until the job times out
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghc libghc-xmonad-contrib-dev libghc-dbus-dev

      - name: Type-check xmonad.hs
        # Fail on warnings, including deprecations. /usr/bin/ghc is Ubuntu's
        # GHC, which knows about the packages above; a GHC installed some
        # other way may come first on the PATH.
        run: /usr/bin/ghc -Wall -Werror -fno-code -outputdir "$RUNNER_TEMP/ghc" xmonad.hs
